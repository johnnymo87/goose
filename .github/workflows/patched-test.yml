# Reusable workflow to run unit tests and graph checks for the fork's patches.
# Shared by patched-release.yml (on tag release) and patched-ci.yml (on PRs to patched/**).
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit ref to test"
        required: true
        type: string

name: "Patched tests"

permissions:
  contents: read

jobs:
  test-patches:
    name: test-patches
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev libxcb1-dev protobuf-compiler cmake clang libclang-dev
      - name: Vendored acp-http is the one in the build graph
        # An unused [patch] is only a cargo warning; fail loudly instead. --locked also
        # fails if Cargo.lock is stale (build-cli-linux.yml does not pass --locked).
        run: |
          cargo tree --locked -p goose-cli --features acp-http -i agent-client-protocol-http --depth 0 \
            | tee /dev/stderr | grep -F 'vendor/agent-client-protocol-http'
      - name: Test patched modules
        run: |
          run_exact_tests() {
            local cargo_args=()
            local tests=()
            local seen_sep=false

            for arg in "$@"; do
              if [ "$arg" = "--" ]; then
                seen_sep=true
                continue
              fi
              if [ "$seen_sep" = true ]; then
                tests+=("$arg")
              else
                cargo_args+=("$arg")
              fi
            done

            echo "Verifying ${#tests[@]} exact test(s) exist for: cargo test ${cargo_args[*]}..."
            local list
            list="$(cargo test "${cargo_args[@]}" -- "${tests[@]}" --exact --list)"
            for t in "${tests[@]}"; do
              if ! echo "$list" | grep -q "^$t: \(test\|benchmark\)$"; then
                echo "Error: exact test '$t' not found in cargo test ${cargo_args[*]}" >&2
                exit 1
              fi
            done
            echo "All ${#tests[@]} exact test(s) verified to exist."

            cargo test "${cargo_args[@]}" -- "${tests[@]}" --exact
          }

          F=code-mode,tree-sitter,aws-providers,telemetry,otel,rustls-tls,live-voice,system-keyring,platform-apps,chat-recall,scheduler,acp-http,online-model-meta
          run_exact_tests --release -p goose --features "$F" --lib -- \
            "providers::gcpvertexai::tests::test_build_vertex_url_proxy_host_keeps_target_location_in_path" \
            "providers::gcpauth::tests::authorized_user_scope_defaults_and_overrides" \
            "model_config::cache_ttl_tests::rederive_preserves_stored_ttl_when_config_absent" \
            "model_config::cache_ttl_tests::rederive_replaces_stored_ttl_with_configured_value" \
            "model_config::cache_ttl_tests::rederive_applies_configured_ttl_when_stored_absent" \
            "model_config::cache_ttl_tests::rederive_leaves_unset_when_both_stored_and_config_absent" \
            "skills::tests::global_skill_dirs_are_scanned_by_default" \
            "skills::tests::global_skills_false_scans_only_project_dirs" \
            "skills::tests::unrecognised_global_skills_value_fails_toward_project_only" \
            "skills::tests::global_skills_false_also_refuses_path_resolution_into_home_roots" \
            "providers::gcpvertexai::tests::test_route_host_sends_only_gemini_to_the_gemini_host" \
            "session_context::tests::test_parse_header_names" \
            "session_context::tests::test_session_id_request_builder_rejects_invalid_header_override" \
            "session_context::tests::test_session_headers_builder_top_level_session_has_no_parent_header" \
            "session_context::tests::test_session_headers_builder_sends_every_name_and_the_parent" \
            "session::session_manager::tests::test_parent_link_is_visible_to_providers" \
            "recipe::tests::test_format_serde_error_invalid_thinking_effort" \
            "agents::platform_extensions::summon::tests::test_resolve_model_config_recipe_thinking_effort_overrides_parent_on_override" \
            "agents::platform_extensions::summon::tests::test_resolve_model_config_recipe_thinking_effort_overrides_parent_on_clone" \
            "agents::platform_extensions::summon::tests::test_resolve_model_config_recipe_without_thinking_effort_inherits_parent" \
            "agents::platform_extensions::summon::tests::test_recipe_yaml_thinking_effort_parsing" \
            "providers::formats::gcpvertexai::tests::claude_adaptive_thinking_requests_summarized_display" \
            "agents::reply_parts::tests::toolshim_provider_stream_coalesces_streamed_thinking" \
            "agents::reply_parts::tests::thinking_deltas_before_transient_error_retries_and_succeeds" \
            "agents::reply_parts::tests::signed_thinking_close_before_transient_error_does_not_retry" \
            "acp::turn_error::tests::provider_errors_map_to_their_kind" \
            "acp::turn_error::tests::loop_errors_map_to_their_kind" \
            "acp::turn_error::tests::turn_failed_data_carries_reason_kind_and_message" \
            "acp::turn_error::tests::turn_error_message_under_the_cap_is_kept_whole" \
            "acp::turn_error::tests::turn_error_message_over_the_cap_is_cut_on_a_char_boundary" \
            "acp::server::tests::test_authentication_message_maps_to_auth_required" \
            "acp::server::tests::test_other_error_messages_map_to_internal_error" \
            "acp::server::session_settings::tests::max_turns_from_meta_absent_or_null_is_default" \
            "acp::server::session_settings::tests::max_turns_from_meta_accepts_positive_integer" \
            "acp::server::session_settings::tests::max_turns_from_meta_rejects_invalid_values" \
            "acp::server::session_settings::tests::cache_ttl_is_normalized_and_validated" \
            "agents::mcp_startup_timeout::tests::test_mcp_client_startup_timeout_format" \
            "agents::mcp_startup_timeout::tests::test_mcp_client_startup_timeout_resolve" \
            "agents::mcp_startup_timeout::tests::test_mcp_client_startup_timeout_auto_lifecycle" \
            "agents::mcp_startup_timeout::tests::test_mcp_client_startup_timeout_discover_lifecycle" \
            "agents::mcp_startup_timeout::tests::test_mcp_client_startup_timeout_initialize_lifecycle" \
            "agents::extension_manager::stdio::startup_tests::test_mcp_client_startup_timeout_stdio_kills_process_group" \
            "agents::extension_manager::stdio::startup_tests::test_mcp_client_startup_timeout_stdio_abandoned_start_kills_process_group" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_roles_dir_wins_over_local_sources" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_roles_dir_unset_keeps_upstream_order" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_roles_dir_tilde_expanded" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_roles_dir_invalid_recipe_fails_closed_without_shadowing" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_declared_extensions_replace_parent" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_filter_only_narrows_declared" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_undeclared_inherits_parent_when_unconfigured" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_unscoped_gets_default_recipe_extensions" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_declared_recipe_ignores_default" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_missing_default_recipe_fails_closed" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_default_recipe_without_extensions_fails_closed" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_default_recipe_tilde_expanded" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_unscoped_delegate_gets_default_recipe_instructions" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_delegate_tool_description_reflects_default_recipe" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_strict_start_accepts_extensions_that_start" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_strict_start_fails_on_an_extension_that_does_not_start" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_delegate_fails_when_its_extension_does_not_start" \
            "agents::platform_extensions::summon::subagent_policy::tests::subagent_policy_delegate_without_policy_runs_on_after_a_failed_extension" \
            "acp::server::truncate_from_message::tests::message_id_from_meta_reads_goose_message_id" \
            "acp::server::truncate_from_message::tests::message_id_from_meta_rejects_empty_or_non_string" \
            "acp::server::truncate_from_message::tests::agent_capabilities_advertise_truncate_from_message" \
            "session::session_manager::tests::test_truncate_conversation_from_message_keeps_same_second_previous_rows"

          run_exact_tests --release -p goose --features "$F" --test acp_server_test -- \
            "test_prompt_reports_context_error_when_compaction_limit_is_exhausted" \
            "test_prompt_fails_and_streams_the_error" \
            "test_manual_compaction_refusal_fails_without_replacing_context" \
            "test_prompt_message_id_and_truncate_from_message"

          run_exact_tests --release -p goose --features "$F" --test acp_session_settings_test -- \
            "test_session_settings_set_rejects_invalid_input" \
            "test_session_settings_set_persists_and_survives_reload" \
            "test_session_settings_set_activates_cold_session" \
            "test_prompt_max_turns_bounds_run" \
            "test_session_settings_idempotent_prompts_byte_identical" \
            "test_session_settings_templated_recipe_renders_consistently"

          run_exact_tests --release -p goose-provider-types --lib -- \
            "formats::anthropic::tests::native_claude_thinking_carries_display_and_block_binding" \
            "formats::anthropic::tests::summarized_thinking_round_trips_with_its_signature" \
            "formats::anthropic::tests::test_streaming_thinking_arrives_before_its_block_stops" \
            "formats::anthropic::tests::test_streaming_omitted_thinking_yields_one_signed_block" \
            "formats::anthropic::tests::test_streamed_thinking_text_and_tool_call_store_one_message" \
            "formats::anthropic::tests::test_streaming_thinking_after_completed_tool_use" \
            "formats::anthropic::tests::test_streaming_thinking_and_text" \
            "formats::anthropic::tests::test_streaming_thinking_from_start_block_without_signature" \
            "formats::anthropic::tests::test_streaming_thinking_text_then_tool_call" \
            "formats::anthropic::tests::test_streaming_redacted_thinking"

          run_exact_tests --release -p goose-cli --lib -- \
            "session::builder::tests::resume_keeps_saved_cache_ttl_when_config_absent"

          cargo test --release -p agent-client-protocol-http --features server --lib
