# Fork watcher (L1, workstation-6w7i.27.4): every day, move the patch stack onto the newest
# upstream goose release that has been the latest release for 48 h. The logic, its
# outcomes and a local dry-run recipe are in .github/fork/upstream_sync.py.
#
# Clean: pushes patched/vX.Y.Z and tag patched-X.Y.Z.0; the tag push starts
# patched-release.yml on that tag, and workstation's update-goose.yml opens the pin PR
# from the finished release. Conflicted: one draft PR upstream-sync/vX.Y.Z -> base/vX.Y.Z,
# which wakes the goose program's coordinator (agent-wait --new-pr on fork-sync/**).
#
# Secret GOOSE_SYNC_TOKEN: a fine-grained PAT for this repo only (Contents, Workflows and
# Pull requests: read and write). GITHUB_TOKEN will not do: GitHub refuses any push by it
# that adds a .github/workflows blob the repo has not seen (measured 2026-11-22, run
# 45042888433), and every upstream release changes workflows; a tag it pushes would not
# start patched-release.yml either. Without the secret, days with nothing to do stay green
# and a day with work fails red.
#
# Repo variable GOOSE_HOLD: any non-empty value pauses the watcher.
#
# Manual runs default to the test-l1/ prefix: branches test-l1/..., tags test-l1-patched-*
# (which do not start a release). Clear the prefix only to do the real thing by hand;
# skip_tests and allow_same are refused without a test- prefix.
#
# Two jobs so the push token never shares a runner with the candidate's build scripts:
# prepare (no write credential) decides, cherry-picks, builds and tests, and hands a plan
# plus a git bundle to publish (GOOSE_SYNC_TOKEN), which runs no candidate code.
name: Upstream sync

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      prefix:
        description: "Branch prefix; tags get it with / replaced by -. Empty = real run."
        default: "test-l1/"
      target:
        description: "Upstream tag to move to (default: newest release latest for 48 h)"
        default: ""
      base:
        description: "Patched tag whose stack to move (default: newest complete patched release)"
        default: ""
      skip_tests:
        description: "Skip the patched test filter (rehearsals of the conflict path)"
        type: boolean
        default: false
      allow_same:
        description: "Re-apply onto the base's own version (clean-path rehearsal; needs a prefix)"
        type: boolean
        default: false
      plan_only:
        description: "Only print the decision"
        type: boolean
        default: false

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Builds and tests a new upstream release's code, so it holds no write credential:
  # the token-like variables are also stripped from the test steps' environment.
  prepare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    permissions:
      contents: read
      pull-requests: read
    outputs:
      work: ${{ steps.prepare.outputs.work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Watcher self-test
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/fork/test_upstream_sync.py
      - name: python3-yaml (the watcher reads the candidate's patched-test.yml)
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-yaml
      - name: Prepare
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GOOSE_HOLD: ${{ vars.GOOSE_HOLD }}
          L1_PREFIX: ${{ inputs.prefix }}
          L1_TARGET: ${{ inputs.target }}
          L1_BASE: ${{ inputs.base }}
          L1_SKIP_TESTS: ${{ inputs.skip_tests && '1' || '' }}
          L1_ALLOW_SAME: ${{ inputs.allow_same && '1' || '' }}
          L1_PLAN_ONLY: ${{ inputs.plan_only && '1' || '' }}
        run: python3 .github/fork/upstream_sync.py prepare "$RUNNER_TEMP/l1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: steps.prepare.outputs.work == 'true'
        with:
          name: upstream-sync
          path: ${{ runner.temp }}/l1
          retention-days: 7

  # Performs the pushes and PR edits prepare wrote down, after checking them (prepare ran
  # candidate code that could have rewritten its own output): only watcher-shaped refs,
  # and only commits whose patch-id the fork already holds. Runs nothing from the
  # candidate tree. contents/pull-requests write is used only by a test-l1/ rehearsal's
  # GITHUB_TOKEN fallback; a real run pushes with GOOSE_SYNC_TOKEN.
  publish:
    needs: prepare
    if: needs.prepare.outputs.work == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: upstream-sync
          path: ${{ runner.temp }}/l1
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GOOSE_SYNC_TOKEN: ${{ secrets.GOOSE_SYNC_TOKEN }}
          L1_FALLBACK_TOKEN: ${{ github.token }}
          L1_PREFIX: ${{ inputs.prefix }}
        run: python3 .github/fork/upstream_sync.py publish "$RUNNER_TEMP/l1"
