# Modified by Jonathan Mohrbacher, 2026: the release builds with upstream's Linux CLI build workflow and patched-build-macos.yml (macOS CLI build, unsigned); test-patches runs unit tests for carried patches (patches 2, 3, 5, 6, 7, 13, 19, 23, 25).
# Builds this branch (an upstream release tag plus a few local patches) with upstream's own
# Linux CLI build workflow and patched-build-macos.yml (upstream's macOS CLI build, unsigned), so the result
# differs from the upstream release only by the patches, and publishes the gnu tarballs and the
# aarch64-apple-darwin tarballs as a release of this fork.
#
# A release made before the darwin build was added gets its darwin assets from
# patched-release-darwin.yml (push a darwin-backfill-<tag> tag).
#
# Run: push a tag named patched-<upstream version>.<n>, e.g. patched-1.54.0.1, on the patched branch.
# The name must not start with "v": upstream's release.yml and publish-docker.yml fire on v* tags.
on:
  push:
    tags:
      - "patched-*"

name: "Patched release"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-cli-linux.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  # The Mac runs the same patched goose as the Linux hosts (workstation pkgs/goose).
  # Unsigned: the Nix fetch never sets a quarantine attribute, and the linker's ad-hoc
  # signature is all Apple Silicon needs to exec a binary.
  build-macos:
    uses: ./.github/workflows/patched-build-macos.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  # Unit tests for the patched code paths (including the vendored acp-http crate), on the same toolchain.
  test-patches:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev libxcb1-dev protobuf-compiler cmake clang libclang-dev
      - name: Vendored acp-http is the one in the build graph
        # An unused [patch] is only a cargo warning; fail loudly instead. --locked also
        # fails if Cargo.lock is stale (build-cli-linux.yml does not pass --locked).
        run: |
          cargo tree --locked -p goose-cli --features acp-http -i agent-client-protocol-http --depth 0 \
            | tee /dev/stderr | grep -F 'vendor/agent-client-protocol-http'
      - name: Test patched modules
        run: |
          F=code-mode,tree-sitter,aws-providers,telemetry,otel,rustls-tls,live-voice,system-keyring,platform-apps,chat-recall,scheduler,acp-http,online-model-meta
          cargo test --release -p goose --features "$F" --lib -- gcpvertexai session_context test_parent_link_is_visible_to_providers gcpauth cache_ttl global_skill recipe_thinking_effort recipe_without_thinking_effort thinking_effort_parsing invalid_thinking_effort toolshim_provider_stream
          cargo test --release -p goose-provider-types --lib -- native_claude_thinking summarized_thinking_round_trips test_streaming_thinking test_streaming_redacted_thinking
          cargo test --release -p goose-cli --lib -- cache_ttl
          cargo test --release -p agent-client-protocol-http --features server --lib

  release:
    needs: [build, build-macos, test-patches]
    if: ${{ !cancelled() && needs.test-patches.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: goose-*-unknown-linux-gnu
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: goose-aarch64-apple-darwin
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          test -f dist/goose-aarch64-unknown-linux-gnu.tar.gz
          test -f dist/goose-aarch64-apple-darwin.tar.gz
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes "Upstream goose v$(echo "$TAG" | sed -E 's/^patched-([0-9]+[.][0-9]+[.][0-9]+).*/\1/') plus the local patches committed after that tag at $GITHUB_SHA."
