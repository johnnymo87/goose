# Builds this branch (an upstream release tag plus a few local patches) with upstream's own
# Linux CLI build workflow, so the result differs from the upstream release only by the patches,
# and publishes the gnu tarballs as a release of this fork.
#
# Run: push a tag named patched-<upstream version>.<n>, e.g. patched-1.54.0.1, on the patched branch.
# The name must not start with "v": upstream's release.yml and publish-docker.yml fire on v* tags.
on:
  push:
    tags:
      - "patched-*"

name: "Patched release"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-cli-linux.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  # Unit tests for the patched code paths (including the vendored acp-http crate), on the same toolchain.
  test-patches:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev libxcb1-dev protobuf-compiler cmake clang libclang-dev
      - name: Vendored acp-http is the one in the build graph
        # An unused [patch] is only a cargo warning; fail loudly instead. --locked also
        # fails if Cargo.lock is stale (build-cli-linux.yml does not pass --locked).
        run: |
          cargo tree --locked -p goose-cli --features acp-http -i agent-client-protocol-http --depth 0 \
            | tee /dev/stderr | grep -F 'vendor/agent-client-protocol-http'
      - name: Test patched modules
        run: |
          F=code-mode,tree-sitter,aws-providers,telemetry,otel,rustls-tls,live-voice,system-keyring,platform-apps,chat-recall,scheduler,acp-http,online-model-meta
          cargo test --release -p goose --features "$F" --lib -- gcpvertexai gcpauth process_group cache_ttl max_turns_from_meta test_add_final_output_tool rolling self_compact compact_kind
          cargo test --release -p goose --features "$F" --test acp_server_test -- test_session_settings test_prompt_max_turns_bounds_run test_prompt_self_compact
          cargo test --release -p goose --features "$F" --test rolling_memory
          cargo test --release -p goose --features "$F" --test self_compact
          cargo test --release -p goose-sdk-types --lib -- settings_request rolling_memory_dto
          cargo test --release -p goose-cli --lib -- cache_ttl
          cargo test --release -p agent-client-protocol-http --features server --lib

  release:
    needs: [build, test-patches]
    if: ${{ !cancelled() && needs.test-patches.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: goose-*-unknown-linux-gnu
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          test -f dist/goose-aarch64-unknown-linux-gnu.tar.gz
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes "Upstream goose v$(echo "$TAG" | sed -E 's/^patched-([0-9]+[.][0-9]+[.][0-9]+).*/\1/') plus the local patches committed after that tag at $GITHUB_SHA."
