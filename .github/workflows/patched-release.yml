# Builds this branch (an upstream release tag plus a few local patches) with upstream's own
# Linux CLI build workflow, so the result differs from the upstream release only by the patches,
# and publishes the gnu tarballs as a release of this fork.
#
# Run: gh workflow run patched-release.yml --ref <branch> -f tag=v1.54.0-patched.1
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v1.54.0-patched.1"
        required: true
        type: string

name: "Patched release"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-cli-linux.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: goose-*-unknown-linux-gnu
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          ls -la dist
          test -f dist/goose-aarch64-unknown-linux-gnu.tar.gz
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes "Upstream $(echo "$TAG" | sed 's/-patched.*//') plus the commits on branch ${GITHUB_REF_NAME} after that tag."
